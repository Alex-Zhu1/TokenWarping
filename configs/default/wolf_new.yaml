pretrained_model_path: 'stablediffusionapi/flat-2d-animerge'
output_dir: ""    # "./outputs/v1_demo/pose/dance"
pretrained_controlnet_path: "/mnt/data/users/haiming.zhu/weight/sd-controlnet-hed/"

control_config:
  type: "hed"
  low_threshold: 100
  high_threshold: 100
  control_scale: 0.95

train_data:
  video_path: "videos/wolf.mp4"
  prompt: "a fluffy wolf"
  n_sample_frames: 40
  width: 512
  height: 512
  sample_start_idx: 0
  sample_frame_rate: 1

validation_data:
  prompts:
    - "A hand-drawn animatin of a elephant, cartoon style"
  video_length: 40
  width: 512
  height: 512
  guidance_scale: 7.5
  num_steps: 50
  start: "noise" # forward diffusion
  edit_type: "DDIM"  # reserve diffusion
  sample_start_idx: 0
  sample_frame_rate: 1

learning_rate: 3e-5
train_batch_size: 1
max_train_steps: 80
validation_steps: 20
trainable_modules:
  - "attn1.to_out"
  - "attn_temp"
  - "norm_temp"
  - "conv_temp"

seed: 0
mixed_precision: fp16
gradient_checkpointing: True
enable_xformers_memory_efficient_attention: True