pretrained_model_path: "stablediffusionapi/ghostmix"
output_dir: "outputs/tradition_input"    # "./outputs/v1_demo/pose/dance"
pretrained_controlnet_path: "/mnt/data/users/haiming.zhu/weight/sd-controlnet-hed/"

control_config:
  type: "hed"
  control_scale: 0.85  # 0.85
  unet_subfolder: "unet"

train_data:
  video_path: "videos/tradition_input.mp4"
  prompt: ""
  n_sample_frames: 50
  width: 512
  height: 512
  sample_start_idx: 0
  sample_frame_rate: 1

validation_data:
  prompts:
    - "a traditional girl, hanfu, closed eyes"
  video_length: 500
  width: 512
  height: 512
  guidance_scale: 7.5 
  num_steps: 50
  start: "noise"
  edit_type: "DDIM"
  sample_start_idx: 0
  sample_frame_rate: 1

learning_rate: 3e-5
train_batch_size: 1
max_train_steps: 300
validation_steps: 100
trainable_modules:
  - "attn1.to_q"
  - "attn2.to_q"
  - "attn_temp"
  - "norm_temp"
  - "conv_temp"

seed: 0
mixed_precision: fp16
gradient_checkpointing: True
enable_xformers_memory_efficient_attention: True